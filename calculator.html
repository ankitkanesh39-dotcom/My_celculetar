<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101820;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.calculator {
    width: 320px;
    background: #202b38;
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 10px 30px #0008;
}

h1 {
    color: white;
    text-align: center;
}

#display {
    width: 100%;
    height: 75px;
    background: #101820;
    color: white;
    font-size: 32px;
    text-align: right;
    padding: 15px;
    border: none;
    border-radius: 12px;
    margin-bottom: 15px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 12px;
    font-size: 23px;
    background: #34495e;
    color: white;
}

.operator {
    background: #ff9800;
}

.special {
    background: #607d8b;
}

.equal {
    background: #16a085;
    grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">

<h1>MY CALCULATOR</h1>

<input type="text" id="display" value="0" readonly>

<div class="buttons">

<button class="special" onclick="clearDisplay()">AC</button>
<button class="special" onclick="deleteLast()">DEL</button>
<button class="special" onclick="percentage()">%</button>
<button class="operator" onclick="press('/')">÷</button>

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button class="operator" onclick="press('*')">×</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button class="operator" onclick="press('-')">−</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button class="operator" onclick="press('+')">+</button>

<button onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>
</div>

<script>

const display = document.getElementById("display");

function press(value) {
    if (display.value === "0" || display.value === "Error") {
        display.value = value;
    } else {
        display.value += value;
    }
}

function clearDisplay() {
    display.value = "0";
}

function deleteLast() {
    display.value = display.value.slice(0, -1) || "0";
}

function calculate() {
    try {
        let expression = display.value;

        if (!/^[0-9+\-*/.() ]+$/.test(expression)) {
            throw new Error("Invalid");
        }

        let result = Function('"use strict"; return (' + expression + ')')();

        if (!Number.isFinite(result)) {
            throw new Error("Invalid");
        }

        display.value = Number(result.toPrecision(12)).toString();

    } catch (error) {
        display.value = "Error";
    }
}

function percentage() {
    let value = Number(display.value);

    if (Number.isFinite(value)) {
        display.value = String(value / 100);
    }
}

</script>

</body>
</html>
